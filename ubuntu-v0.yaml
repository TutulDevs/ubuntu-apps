#cloud-config
autoinstall:
  version: 1
  
  # System Identity & User Creation
  identity:
    hostname: lenovo
    username: tutul
    realname: "tutul"
    password: "$6$rounds=409600$3aK1/7X2mB$L8n.k3jO1E5N6L8x1W4v2Z.3y4X5w6V7u8T9s0R1q2P3O4N5M6L7K8J9I0H1G2F3E4D5C6B7A8"

  # Regional Settings
  locale: en_US.UTF-8
  timezone: Asia/Dhaka
  keyboard:
    layout: us

  # Explicit Custom Partition Scheme on /dev/sda
  storage:
    config:
      # Target Disk Definition
      - id: disk-sda
        type: disk
        match:
          path: /dev/sda
        wipe: superblock
        ptable: gpt

      # 1. /boot Partition (1024 MB - ext4)
      - id: partition-boot
        type: partition
        device: disk-sda
        size: 1024M
        flag: boot
      - id: format-boot
        type: format
        fstype: ext4
        volume: partition-boot
      - id: mount-boot
        type: mount
        path: /boot
        device: format-boot

      # 2. EFI System Partition (512 MB - fat32)
      - id: partition-efi
        type: partition
        device: disk-sda
        size: 512M
        flag: boot
      - id: format-efi
        type: format
        fstype: fat32
        volume: partition-efi
      - id: mount-efi
        type: mount
        path: /boot/efi
        device: format-efi

      # 3. Swap Partition (32768 MB / 32 GB)
      - id: partition-swap
        type: partition
        device: disk-sda
        size: 32768M
      - id: format-swap
        type: format
        fstype: swap
        volume: partition-swap
      - id: mount-swap
        type: mount
        path: none
        device: format-swap

      # 4. Root / Partition (~500 GB - ext4)
      - id: partition-root
        type: partition
        device: disk-sda
        size: 511999M
      - id: format-root
        type: format
        fstype: ext4
        volume: partition-root
      - id: mount-root
        type: mount
        path: /
        device: format-root

      # 5. /home Partition (~443 GB - ext4 using remaining space)
      - id: partition-home
        type: partition
        device: disk-sda
        size: -1
      - id: format-home
        type: format
        fstype: ext4
        volume: partition-home
      - id: mount-home
        type: mount
        path: /home
        device: format-home

  # Software Packages & System Type
  packages:
    - ubuntu-desktop
    - git
    - openssh-server

  # SSH Access Options
  ssh:
    install-server: true
    allow-pw: true

  # Ensure System Boots into GUI Desktop
  late-commands:
    - curtin in-target -- systemctl set-default graphical.target

  # Post-install Action
  shutdown: reboot