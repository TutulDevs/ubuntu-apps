#cloud-config
autoinstall:
  version: 1
  
  # System Identity & User Creation
  identity:
    hostname: lenovo
    username: tutul
    realname: "tutul"
    password: "$6$rounds=409600$9EilctNXi4RG7Xwe$EsZSvsDmt4oAoN3FMzDAzHrxdr4s5Ni9rUXZC1DuwtyFH0ON8nnMEoiI/WwOD9cDkna0F6MMdBfSPG85n3fQK."

  # Regional Settings
  locale: en_US.UTF-8
  timezone: Asia/Dhaka
  keyboard:
    layout: us

  # Explicit Custom Partition Scheme on /dev/nvme0n1
  storage:
    config:
      # Target Disk Definition
      - id: disk-nvme0n1
        type: disk
        match:
          path: /dev/nvme0n1
        wipe: superblock
        ptable: gpt

      # 1. EFI System Partition (1536 MB / 1.5 GB - fat32)
      - id: partition-efi
        type: partition
        device: disk-nvme0n1
        size: 1536M
        flag: boot
        grub_device: true
      - id: format-efi
        type: format
        fstype: fat32
        volume: partition-efi
      - id: mount-efi
        type: mount
        path: /boot/efi
        device: format-efi

      # 2. /boot Partition (1024 MB - ext4)
      - id: partition-boot
        type: partition
        device: disk-nvme0n1
        size: 1024M
      - id: format-boot
        type: format
        fstype: ext4
        volume: partition-boot
      - id: mount-boot
        type: mount
        path: /boot
        device: format-boot

      # 3. Swap Partition (16384 MB / 16 GB)
      - id: partition-swap
        type: partition
        device: disk-nvme0n1
        size: 16384M
      - id: format-swap
        type: format
        fstype: swap
        volume: partition-swap
      - id: mount-swap
        type: mount
        path: none
        device: format-swap

      # 4. Root / Partition (~100 GB - ext4)
      - id: partition-root
        type: partition
        device: disk-nvme0n1
        size: 100000M
      - id: format-root
        type: format
        fstype: ext4
        volume: partition-root
      - id: mount-root
        type: mount
        path: /
        device: format-root

      # 5. /projects Partition (250 GB - ext4, must be allocated before /home
      #    since /home takes all remaining space)
      - id: partition-projects
        type: partition
        device: disk-nvme0n1
        size: 250000M
      - id: format-projects
        type: format
        fstype: ext4
        volume: partition-projects
      - id: mount-projects
        type: mount
        path: /projects
        device: format-projects

      # 6. /home Partition (remaining space - ext4)
      - id: partition-home
        type: partition
        device: disk-nvme0n1
        size: -1
      - id: format-home
        type: format
        fstype: ext4
        volume: partition-home
      - id: mount-home
        type: mount
        path: /home
        device: format-home

  # Software Packages & System Type
  packages:
    - ubuntu-desktop
    - git
    - openssh-server

  # SSH Access Options
  ssh:
    install-server: true
    allow-pw: true

  # Ensure System Boots into GUI Desktop
  late-commands:
    - curtin in-target -- systemctl set-default graphical.target

  # Post-install Action
  shutdown: reboot